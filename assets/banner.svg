<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Radar Pulse Gradient -->
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Mesh Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    </pattern>

    <style>
      .beacon-ring {
        animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        transform-origin: 980px 180px;
      }
      .beacon-ring-2 {
        animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite 1.5s;
        transform-origin: 980px 180px;
      }
      .flow-path {
        stroke-dasharray: 8 6;
        animation: dashFlow 12s linear infinite;
      }
      .node-pulse {
        animation: flicker 2s infinite alternate ease-in-out;
      }
      @keyframes pulse {
        0% { transform: scale(0.6); opacity: 0.8; }
        50% { opacity: 0.4; }
        100% { transform: scale(1.6); opacity: 0; }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes flicker {
        0% { opacity: 0.3; }
        100% { opacity: 0.9; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Dynamic / Animated Waypoint Fleet Navigation Mesh in Background -->
  <g opacity="0.45">
    <!-- Dynamic Radar Rings (Right Side - Autonomy Hub) -->
    <circle cx="980" cy="180" r="110" fill="url(#radarGlow)" />
    <circle cx="980" cy="180" r="100" fill="none" stroke="#f59e0b" stroke-width="1.5" class="beacon-ring" />
    <circle cx="980" cy="180" r="100" fill="none" stroke="#f97316" stroke-width="1" class="beacon-ring-2" />
    <circle cx="980" cy="180" r="45" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="980" cy="180" r="6" fill="#f59e0b" />

    <!-- Animated Autonomous Dispatch Vectors -->
    <path d="M 680 70 L 820 120 L 980 180 L 860 270 L 690 290" fill="none" stroke="#f59e0b" stroke-width="2" class="flow-path" stroke-opacity="0.7" />
    <path d="M 720 180 L 820 120 L 980 180 L 1100 240" fill="none" stroke="#f97316" stroke-width="1.5" class="flow-path" stroke-opacity="0.5" />
    <path d="M 980 180 L 1120 120" fill="none" stroke="#e11d48" stroke-width="1.5" class="flow-path" stroke-opacity="0.6" />

    <!-- Dynamic Fleet Nodes -->
    <circle cx="680" cy="70" r="5" fill="#f59e0b" class="node-pulse" />
    <circle cx="820" cy="120" r="6" fill="#f97316" class="node-pulse" />
    <circle cx="860" cy="270" r="5" fill="#e11d48" class="node-pulse" />
    <circle cx="690" cy="290" r="5" fill="#f59e0b" class="node-pulse" />
    <circle cx="1100" cy="240" r="5" fill="#f59e0b" class="node-pulse" />
    <circle cx="1120" cy="120" r="4" fill="#f97316" class="node-pulse" />
  </g>

  <!-- Ground Terrain Contour Line (Stylized Pit Depth) -->
  <path d="M 0 330 Q 300 320 600 340 T 1200 325" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5" />
  <path d="M 0 345 Q 400 335 800 355 T 1200 340" fill="none" stroke="#f97316" stroke-opacity="0.2" stroke-width="1" />

  <!-- Left Content: High Visibility Badge Pill -->
  <g transform="translate(60, 50)">
    <rect width="250" height="32" rx="16" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="18" cy="16" r="4" fill="#f59e0b" />
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fcd34d" letter-spacing="1.2">HEAVY FLEET AUTONOMY</text>
  </g>

  <!-- Left Content: Foreground Title -->
  <g transform="translate(60, 130)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      AUTONOMOUS MINING
    </text>
    <text y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="900" fill="url(#accentGrad)" letter-spacing="-0.5">
      HEAVY FLEET NAVIGATORS
    </text>
  </g>

  <!-- Left Content: Foreground Subtitle -->
  <g transform="translate(60, 226)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#94a3b8">
      Curated Stack of Autonomous Haulage Systems (AHS), Fleet Dispatch,
    </text>
    <text y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#94a3b8">
      Off-Road Perception &amp; Unmanned Excavation Robotics (SaaS &amp; Open Source)
    </text>
  </g>

  <!-- Bottom Badges Pills Row -->
  <g transform="translate(60, 290)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="135" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="12" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">🚜 Haulage (AHS)</text>
    
    <!-- Pill 2 -->
    <rect x="145" y="0" width="145" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="157" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">📡 VDA 5050 &amp; RMF</text>

    <!-- Pill 3 -->
    <rect x="300" y="0" width="145" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="312" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">🏔️ Off-Road Autonomy</text>

    <!-- Pill 4 -->
    <rect x="455" y="0" width="145" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="467" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">⚡ Sim-to-Real RL</text>
  </g>
</svg>
